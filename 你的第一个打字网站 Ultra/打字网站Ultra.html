<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>你的第一个打字网站 Ultra</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#232c38;--txt:#e6edf3;--dim:#8b949e;
--acc:#3fb950;--acc2:#7ee787;--amber:#f0b429;--red:#f85149;--blue:#58a6ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 620px at 50% -12%,#16202b 0%,var(--bg) 62%);color:var(--txt);
font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.wrap{max-width:1020px;margin:0 auto;padding:22px 22px 46px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 24px}
.brand{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;letter-spacing:.04em;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc2);box-shadow:0 0 12px var(--acc2)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:13px}
.tab{border:0;background:transparent;color:var(--dim);padding:8px 18px;border-radius:9px;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s}
.tab.on{background:#22303f;color:var(--txt);box-shadow:inset 0 0 0 1px #2d3d4f}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:17px;cursor:pointer}
.iconbtn:hover{color:var(--txt);border-color:#33506d}
.lede{margin:2px 0 18px;color:var(--dim);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{text-align:left;background:linear-gradient(180deg,#171e27,#141a21);border:1px solid var(--line);
border-radius:16px;padding:16px 17px 15px;color:inherit;cursor:pointer;font-family:inherit;transition:.16s}
.card:hover{border-color:#33506d;transform:translateY(-2px);box-shadow:0 14px 34px -22px #000}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cname{font-size:17px;font-weight:600}
.pill{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.cdesc{margin:7px 0 12px;font-size:12.5px;color:var(--dim);line-height:1.55;min-height:36px}
.cmeta{display:flex;justify-content:space-between;font-size:12px;color:#6e7681;margin-bottom:8px}
.track{height:6px;background:#1b222b;border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ea043,var(--acc2));border-radius:99px;transition:width .25s}
.track.big{height:8px;margin:4px 0 16px}
.foot{margin-top:26px;color:#5b6470;font-size:12px;text-align:center}
/* play */
.playbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.ptitle{display:flex;align-items:center;gap:10px;font-size:14px}
.ptitle b{font-weight:600}
.ptitle span{color:var(--dim);font-size:12.5px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px}
.hud>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.hud b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.hud span{font-size:11px;color:var(--dim)}
.stage{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px 8px 18px}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:30px;row-gap:6px}
.syl{display:flex;flex-direction:column;align-items:center;gap:7px}
.hz{font-family:"KaiTi","STKaiti","楷体",serif;font-size:calc(88px * var(--k,1));line-height:1;color:#2b3542;transition:color .18s,text-shadow .18s}
.syl.on .hz{color:var(--acc2);text-shadow:0 0 30px rgba(126,231,135,.22)}
.py{display:flex;gap:1px}
.lt{font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:calc(25px * var(--k,1));line-height:1;color:#49535f;transition:color .07s,background .07s;padding:1px 0}
.lt.en{font-size:calc(54px * var(--k,1));color:#3f4a57;padding:0 1px;line-height:1.02}
.lt.done{color:var(--acc2)}
.lt.cur{color:#0d1117;background:var(--amber);border-radius:5px;box-shadow:0 0 22px rgba(240,180,41,.35)}
.lt.bad{color:var(--red)!important;background:transparent!important;box-shadow:none!important;animation:shake .22s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.hidepy .py{visibility:hidden}
.word.won{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
.meta{display:flex;align-items:center;gap:14px;min-height:24px;font-size:14px;color:#6e7681}
.meta .ipa{color:var(--blue);font-family:"Cascadia Mono",Consolas,monospace;font-size:15px}
.meta .mean{color:#9aa4b1}
.hintline{font-size:12.5px;color:#5b6470}
.actions{display:flex;justify-content:center;gap:10px;margin-top:6px}
.ghost{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:11px;padding:9px 15px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.ghost:hover{color:var(--txt);border-color:#33506d}
.ghost.wide{width:100%;margin-top:14px}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:#8b949e;margin-left:4px}
/* drawer */
.drawer{position:fixed;inset:0 0 0 auto;width:min(372px,94vw);background:#111821;border-left:1px solid var(--line);
z-index:50;padding:20px 22px;overflow:auto;box-shadow:-20px 0 60px -30px #000}
.drawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.drawerHead b{font-size:16px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #1c242e;font-size:13.5px;color:#c9d1d9;cursor:pointer}
.sw input{accent-color:var(--acc);width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:7px;padding:13px 0;border-bottom:1px solid #1c242e;font-size:13px;color:#c9d1d9}
.field>span{display:flex;justify-content:space-between;color:#9aa4b1}
.field em{color:var(--amber);font-style:normal;font-variant-numeric:tabular-nums}
.field select,.field input[type=range]{width:100%;background:#0f151c;border:1px solid var(--line);color:var(--txt);
border-radius:9px;padding:8px 9px;font-family:inherit;font-size:13px}
.field input[type=range]{padding:0;border:0;accent-color:var(--acc)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(6,9,13,.72);display:grid;place-items:center;z-index:70;padding:18px;backdrop-filter:blur(3px)}
.modal .card{width:min(520px,100%);cursor:default;background:#141b23;padding:24px}
.modal h2{margin:0 0 18px;font-size:19px;font-weight:600}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.res>div{background:#0f151c;border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center}
.res b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.res span{font-size:11px;color:var(--dim)}
.wrong{font-size:13px;color:#9aa4b1;line-height:1.8;max-height:120px;overflow:auto;margin-bottom:18px}
.wrong i{font-style:normal;color:var(--red)}
.modal .row{gap:10px}
.primary{background:linear-gradient(180deg,#2ea043,#238636);border:1px solid #2ea043;color:#fff;border-radius:11px;
padding:10px 18px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:600;flex:1}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);background:#1d2733;border:1px solid #33465c;
color:#e6edf3;padding:11px 17px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;
max-width:min(560px,86vw);font-size:13px;line-height:1.55;z-index:80;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 自定义词库 / 文章 */
.article{width:100%;max-width:860px;max-height:38vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
 font-size:calc(27px * var(--k,1));line-height:2;letter-spacing:.01em;padding:8px 6px}
.article.zh{font-family:"KaiTi","STKaiti","楷体",serif}
.article.en{font-family:"Cascadia Mono",Consolas,monospace;font-size:calc(20px * var(--k,1));line-height:2.1;letter-spacing:0}
.article.big{font-size:calc(64px * var(--k,1));line-height:1.6;text-align:center;max-height:none;white-space:normal}
.article.big.en{font-size:calc(44px * var(--k,1))}
.article.won{animation:pop .32s ease-out}
.ac{color:#414b57;transition:color .08s,background .08s}
.ac.done{color:var(--acc2)}
.ac.cur{background:var(--amber);color:#0d1117;border-radius:3px;box-shadow:0 0 0 2px rgba(240,180,41,.18)}
.ac.bad{color:var(--red);text-decoration:underline wavy var(--red)}
.imebox{width:100%;max-width:640px;background:#0f151c;border:1px solid var(--line);color:var(--txt);
 border-radius:12px;padding:11px 14px;font-size:19px;font-family:inherit;outline:none;text-align:center}
.imebox:focus{border-color:#3f6a94;box-shadow:0 0 0 3px rgba(88,166,255,.12)}
.imebox::placeholder{color:#4b5563}
.card.add{border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:132px;
 color:#6e7681;font-size:14px;background:transparent}
.card.add:hover{color:var(--acc2);border-color:#2f6a4a}
.card .del{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:8px;border:1px solid transparent;
 background:transparent;color:#4b5563;cursor:pointer;font-size:16px;line-height:1;font-family:inherit}
.card .del:hover{color:var(--red);border-color:#3a2a2a;background:#1a1416}
.importcard{width:min(620px,100%)}
.importcard textarea,.importcard input[type=text]{width:100%;background:#0f151c;border:1px solid var(--line);
 color:var(--txt);border-radius:9px;padding:9px 10px;font-family:inherit;font-size:13.5px;line-height:1.7;
 resize:vertical;outline:none}
.importcard input[type=text]{resize:none}
.improw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #1c242e}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.mini{background:#0f151c;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 9px;font-family:inherit;font-size:12.5px}
.imphint{min-height:20px;margin:10px 0 14px;font-size:12.5px;color:#7ee787;line-height:1.6}

html[data-theme="light"]{--bg:#f3f5f9;--panel:#fff;--line:#d9e1ea;--txt:#1b2430;--dim:#5a6676;--acc:#1a7f37;--acc2:#1a7f37;--amber:#a86400;--red:#c62828;--blue:#0b62d6;color-scheme:light}
html[data-theme="light"] body{background:#f3f5f9}
html[data-theme="light"] .card{background:#fff;border-color:#d9e1ea}
html[data-theme="light"] .card:hover{border-color:#9db2c9}
html[data-theme="light"] .hud>div,html[data-theme="light"] .res>div{background:#fff;border-color:#d9e1ea}
html[data-theme="light"] .track{background:#e6ecf3}
html[data-theme="light"] .hz{color:#c6cfda}
html[data-theme="light"] .syl.on .hz{color:#1a7f37;text-shadow:none}
html[data-theme="light"] .lt{color:#9aa6b4}
html[data-theme="light"] .lt.done,html[data-theme="light"] .ac.done{color:#1a7f37}
html[data-theme="light"] .lt.en{color:#a8b4c2}
html[data-theme="light"] .lt.cur,html[data-theme="light"] .ac.cur{background:#a86400;color:#fff}
html[data-theme="light"] .ac{color:#a9b5c2}
html[data-theme="light"] .drawer{background:#fff;box-shadow:-20px 0 60px -30px rgba(15,30,50,.25)}
html[data-theme="light"] .modal{background:rgba(25,35,50,.35)}
html[data-theme="light"] .modal .card{background:#fff}
html[data-theme="light"] .importcard textarea,html[data-theme="light"] .importcard input[type=text],html[data-theme="light"] .field select,html[data-theme="light"] .mini{background:#f7f9fc;color:#1b2430}
html[data-theme="light"] .imebox{background:#fff;color:#1b2430}
html[data-theme="light"] #toast{background:#fff;border-color:#d9e1ea;color:#1b2430}
html[data-theme="light"] .tab.on{background:#e8eef7;color:#1b2430;box-shadow:inset 0 0 0 1px #cfdbe9}
html[data-theme="light"] .ghost,html[data-theme="light"] .iconbtn{background:#fff}
html[data-theme="light"] .sw,html[data-theme="light"] .field{border-color:#eef2f7}
html[data-theme="light"] .hintline,html[data-theme="light"] .cdesc,html[data-theme="light"] .cmeta{color:#5a6676}
html[data-theme="light"] .card.add{color:#5a6676}

@media(max-width:680px){
 .wrap{padding:16px 14px 40px}
 .hz{font-size:calc(56px * var(--k,1))}.lt{font-size:calc(18px * var(--k,1))}.lt.en{font-size:calc(34px * var(--k,1))}
 .word{gap:16px}.stage{min-height:210px}
 .hud{grid-template-columns:repeat(2,1fr)}
 .res{grid-template-columns:repeat(2,1fr)}
 .tabs .tab{padding:7px 12px;font-size:13px}
}
@media(max-width:520px){
 header{gap:10px;flex-wrap:nowrap}
 .bname{display:none}
 .hz{font-size:calc(48px * var(--k,1))}.lt{font-size:calc(16px * var(--k,1))}.lt.en{font-size:calc(30px * var(--k,1))}
 .word{gap:11px}.stage{padding:18px 2px 12px}
 .iconbtn{width:36px;height:36px;font-size:15px}
 .playbar .ghost{padding:8px 11px;font-size:12px}
 .hud b{font-size:17px}
 .actions .ghost{padding:8px 11px;font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span><span class="bname">你的第一个打字网站 Ultra</span></div>
    <div class="tabs" id="modeTabs">
      <button class="tab on" data-m="zh">成语</button>
      <button class="tab" data-m="en">单词</button>
      <button class="tab" data-m="random">随机字</button>
      <button class="tab" data-m="article">文章</button>
      <button class="tab" data-m="novel">小说</button>
    </div>
    <button class="iconbtn" id="openSet" title="设置">⚙</button>
  </header>

  <main id="home">
    <p class="lede" id="lede">选一档开始 · 每题先读一遍，再打字 · 空格会自动跳过</p>
    <div class="grid" id="grid"></div>
    <p class="foot">进度只保存在本机浏览器 · 双击即可离线使用</p>
  </main>

  <main id="play" class="hidden">
    <div class="playbar">
      <button class="ghost" id="back">← 返回</button>
      <div class="ptitle"><b id="tierName">—</b><span id="progText"></span></div>
      <button class="ghost" id="skip">跳过</button>
    </div>
    <div class="hud">
      <div><b id="hSpeed">0</b><span>键 / 分</span></div>
      <div><b id="hAcc">100</b><span>正确率 %</span></div>
      <div><b id="hCombo">0</b><span>连击（词）</span></div>
      <div><b id="hTime">0:00</b><span>用时</span></div>
    </div>
    <div class="stage" id="stage">
      <div class="word" id="wordBox"></div>
      <div class="article" id="articleBox" hidden></div>
      <div class="meta" id="metaBox"></div>
      <input id="imeBox" class="imebox" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="点这里，用输入法打字…" hidden>
    </div>
    <div class="track big"><i id="bar"></i></div>
    <div class="actions" id="actions">
      <button class="ghost" id="replay">🔊 重听<kbd>Enter</kbd></button>
      <button class="ghost" id="togglePy">隐藏拼音</button>
    </div>
  </main>
</div>

<aside id="setPanel" class="drawer hidden">
  <div class="drawerHead"><b>设置</b><button class="iconbtn" id="closeSet">✕</button></div>
  <label class="sw"><span>完成音效</span><input type="checkbox" id="setSound"></label>
  <label class="sw"><span>语音朗读（每题先读）</span><input type="checkbox" id="setVoice"></label>
  <label class="sw"><span>显示拼音（中文）</span><input type="checkbox" id="setPinyin"></label>
  <label class="sw"><span>只练未掌握的词</span><input type="checkbox" id="setOnlyNew"></label>
  <div class="field"><span>语速 <em id="rateVal">0.95</em></span><input type="range" id="setRate" min="0.6" max="1.3" step="0.05"></div>
  <div class="field"><span>字号 <em id="fontVal">1.00</em></span><input type="range" id="setFont" min="0.8" max="1.8" step="0.05"></div>
  <label class="sw"><span>浅色模式</span><input type="checkbox" id="setTheme"></label>
  <div class="field" id="orientField"><span>屏幕方向</span>
    <select id="setOrient">
      <option value="landscape">横屏</option><option value="portrait">竖屏</option><option value="auto">跟随系统</option>
    </select>
  </div>
  <div class="field"><span>背景音乐 <em id="bgmName">未选择</em></span>
    <input type="range" id="bgmVol" min="0" max="1" step="0.05">
    <div class="improw" style="border:0;padding:8px 0 0">
      <label class="ghost filebtn">选择音乐<input id="bgmFile" type="file" accept="audio/*" hidden></label>
      <label class="sw" style="border:0;padding:0"><span>播放</span><input type="checkbox" id="bgmOn"></label>
    </div>
  </div>
  <div class="field"><span>每 <em id="groupVal">20</em> 词结算一次</span>
    <input type="range" id="setGroup" min="10" max="200" step="10">
  </div>
  <div class="field"><span>出题顺序</span>
    <select id="setOrder"><option value="seq">顺序</option><option value="random">随机</option></select>
  </div>
  <div class="field"><span>朗读音色</span><select id="setVoiceSel"></select></div>
  <button class="ghost wide" id="resetAll">清空所有练习记录</button>
</aside>

<div id="modal" class="modal hidden">
  <div class="card">
    <h2 id="mTitle">本组完成</h2>
    <div class="res">
      <div><b id="rSpeed">0</b><span>键/分</span></div>
      <div><b id="rAcc">0</b><span>正确率 %</span></div>
      <div><b id="rCombo">0</b><span>最高连击</span></div>
      <div><b id="rTime">0:00</b><span>用时</span></div>
    </div>
    <div class="wrong" id="rWrong"></div>
    <div class="row">
      <button class="primary" id="again">再来一组</button>
      <button class="ghost" id="toHome">回首页</button>
    </div>
  </div>
</div>

<div id="importModal" class="modal hidden">
  <div class="card importcard">
    <h2>导入我的词库</h2>
    <label class="field"><span>名称</span><input id="impName" type="text" maxlength="20" placeholder="给这组词起个名字"></label>
    <label class="field"><span>内容</span>
      <textarea id="impText" rows="7" placeholder="词组：一行一个，可写「成语|hú jiǎ hǔ wèi」或「word|音标|释义」&#10;文章：直接粘贴整段文字"></textarea>
    </label>
    <div class="improw">
      <label class="ghost filebtn">选择 .txt 文件<input id="impFile" type="file" accept=".txt,.md,text/plain" hidden></label>
      <select id="impKind" class="mini">
        <option value="auto">自动判断类型</option><option value="word">词组</option><option value="article">文章</option><option value="chars">字（随机字池）</option>
      </select>
      <select id="impLang" class="mini">
        <option value="auto">自动识别语言</option><option value="zh">中文</option><option value="en">英文</option>
      </select>
    </div>
    <p class="imphint" id="impHint"></p>
    <div class="row">
      <button class="ghost" id="impCancel">取消</button>
      <button class="primary" id="impSave">导入</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<pre id="selftest" hidden></pre>

<script src="data/zh-a.js"></script>
<script src="data/zh-b.js"></script>
<script src="data/en-primary.js"></script>
<script src="data/en-junior.js"></script>
<script src="data/en-senior.js"></script>
<script src="data/en-university.js"></script>
<script src="data/en-b.js"></script>
<script src="data/read-meta.js"></script>
<script src="data/read-py.js"></script>
<script>
"use strict";
/* ---------- 基础 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const LS = "zjtyping.v1";
const DEF = { sound: true, voice: true, pinyin: true, onlyNew: false, rate: 0.95, group: 20, order: "seq", voiceName: "", fontScale: 1, theme: "dark", orientation: "landscape", musicVol: 0.3, musicOn: false, musicData: "", musicName: "" };
let DB = loadDB();
function validCustom(c) {

let AC = null, voices = [];
function beep(ok) {
  if (!DB.s.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime;
    const seq = ok ? [[880, 0, .1, "sine"], [1318.5, .075, .19, "sine"]] : [[150, 0, .09, "square"]];
    for (const [f, dt, dur, type] of seq) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t + dt);
      g.gain.exponentialRampToValueAtTime(ok ? .16 : .1, t + dt + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + dt + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t + dt); o.stop(t + dt + dur + .04);
    }
  } catch (e) {}
}
function refreshVoices() {
  if (!("speechSynthesis" in window)) return;

  const cur = DB.s.voiceName || "";

function pickVoice(lang) {
  const pre = lang.slice(0, 2).toLowerCase();
  const pool = voices.filter(v => (v.lang || "").toLowerCase().startsWith(pre));
  if (!pool.length) return null;
  if (DB.s.voiceName) { const m = pool.find(v => v.name === DB.s.voiceName); if (m) return m; }
  const pref = ["xiaoxiao", "huihui", "yaoyao", "yunxi", "kangkang", "tingting", "jenny", "aria", "zira", "david", "mark", "samantha"];
  for (const p of pref) { const m = pool.find(v => v.name.toLowerCase().includes(p)); if (m) return m; }

/* 单例语音控制器：一次只放一条；要换词时先 cancel、延时再 speak，

function say(text, lang) {
  if (!DB.s.voice || !("speechSynthesis" in window)) return;
  if (!voices.length) refreshVoices();

  const fire = () => {
    if (my !== TTS.seq || !("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = DB.s.rate; u.pitch = 1;
    const v = pickVoice(lang); if (v) u.voice = v;
    let started = false;
    u.onstart = () => { started = true; };
    u.onend = u.onerror = () => { if (TTS.cur === u) TTS.cur = null; };
    TTS.cur = u;
    try { speechSynthesis.speak(u); } catch (e) { TTS.cur = null; return; }
    setTimeout(() => { if (!started && TTS.cur === u) ttsFail(); }, 1800);
  };
  if (TTS.cur || speechSynthesis.speaking || speechSynthesis.pending) {
    if (TTS.cur) { TTS.cur.onend = TTS.cur.onerror = null; TTS.cur = null; }
    speechSynthesis.cancel();

function charPinyinMap() {
  if (window.__CPY) return window.__CPY;
  const counts = new Map();
  for (const t of tiersOf("zh")) for (const w of t.words) {
    const chars = Array.from(w[0]), syls = (w[1] || "").trim().split(/\s+/);
    if (chars.length !== syls.length) continue;
    for (let i = 0; i < chars.length; i++) {
      if (!/[\u4e00-\u9fff]/.test(chars[i])) continue;
      if (!counts.has(chars[i])) counts.set(chars[i], new Map());
      const m = counts.get(chars[i]);
      m.set(syls[i], (m.get(syls[i]) || 0) + 1);
    }
  }
  const out = new Map();
  for (const [c, m] of counts) {
    let best = "", n = -1;
    for (const [p, k] of m) if (k > n) { best = p; n = k; }
    out.set(c, best);
  }
  window.__CPY = out;
  return out;
}

function randomPool() {

function startLetter(t, p) {

function resetRun() {

function renderCommit(text, lang, big) {

function paintCommit(from, to) {
  const c = S.commit, spans = c.spans;
  for (let i = from; i < to && i < spans.length; i++) {
    spans[i].classList.remove("bad", "cur");
    spans[i].classList.add("done");
  }
  const sp = spans[c.pos];
  if (sp) {
    sp.classList.add("cur");
    const box = $("#articleBox");
    const r = sp.getBoundingClientRect(), br = box.getBoundingClientRect();
    if (r.top < br.top + 30) box.scrollTop += r.top - br.top - 30;
    else if (r.bottom > br.bottom - 30) box.scrollTop += r.bottom - br.bottom + 30;
  }
}

}
function startImeWords(t, p) {

  if (!list.length) { toast("这一组都已经掌握了，先在设置里关掉「只练未掌握」。"); return; }
  list = list.slice(0, Math.max(1, DB.s.group));

}
function nextImeWord() {
  if (S.qi >= S.queue.length) return finish();
  S.item = S.queue[S.qi];

function completeImeWord() {
  if (S.done) return;
  S.done = true;
  const clean = S.itemErrs === 0;
  S.combo = clean ? S.combo + 1 : 0;
  S.maxCombo = Math.max(S.maxCombo, S.combo);
  const p = DB.p[S.tier.id] || (DB.p[S.tier.id] = { words: {}, cursor: 0, best: 0, runs: 0 });

  beep(true);
  const box = $("#articleBox");
  box.classList.remove("won"); void box.offsetWidth; box.classList.add("won");

}
function startArticle(t) {
  resetRun();
  const text = t.text;
  const sents = splitSentences(text);
  Object.assign(S, {
    tier: t, lang: t.lang, engine: "commit", commitMode: "article",

function checkSentences() {
  const c = S.commit;
  while (c.si < c.sents.length && c.pos >= c.sents[c.si].e) {
    const s = c.sents[c.si];
    S.lastSentence = c.text.slice(s.s, s.e).trim();
    say(S.lastSentence, S.lang === "zh" ? "zh-CN" : "en-US");
    c.si++;
  }
}
function finishArticle() {
  if (S.done) return;
  S.done = true;
  beep(true);
  finish();
}
function skipSentence() {
  const c = S.commit;
  if (!c) return;
  const idx = c.sents.findIndex(s => c.pos < s.e);
  if (idx < 0) { finishArticle(); return; }
  const s = c.sents[idx];
  for (let i = c.pos; i < s.e; i++) {
    const sp = c.spans[i];
    if (sp) { sp.classList.remove("bad", "cur"); sp.classList.add("done"); }
  }
  c.pos = s.e; c.si = Math.max(c.si, idx + 1); c.badLock = false;
  $("#imeBox").value = "";
  if (c.spans[c.pos]) c.spans[c.pos].classList.add("cur");
  $("#progText").textContent = c.pos + " / " + c.text.length;
  $("#bar").style.width = Math.min(100, c.pos / c.text.length * 100) + "%";
  updateHUD();
  if (c.pos >= c.text.length) finishArticle();
}
function commitInput() {
  const box = $("#imeBox"), c = S.commit;
  if (!c || S.done) return;
  const v = box.value;
  if (!v) return;
  if (!S.started) { S.started = true; S.t0 = performance.now(); }
  const target = c.text.slice(c.pos, c.pos + v.length);
  if (v === target) {
    const from = c.pos;
    c.pos += v.length;
    S.correct += v.length;
    c.badLock = false;
    const val = v;
    setTimeout(() => { if (box.value === val) box.value = ""; }, 0);
    paintCommit(from, c.pos);
    if (S.commitMode === "words") {
      if (c.pos >= c.text.length) completeImeWord();
    } else {
      if (S.read && S.read.novel) { for (const ch of v) speakChar(ch); }
      else checkSentences();
      touchRead();
      $("#progText").textContent = c.pos + " / " + c.text.length;
      $("#bar").style.width = Math.min(100, c.pos / c.text.length * 100) + "%";
      if (c.pos >= c.text.length) { if (S.read) nextReadPage(); else finishArticle(); }
    }
    updateHUD();
  } else {
    if (!c.badLock) {
      c.badLock = true; S.errors++; S.itemErrs = (S.itemErrs || 0) + 1; S.combo = 0;
      if (S.commitMode === "words" && !S.wrongSet.includes(c.text)) S.wrongSet.push(c.text);
    }
    flashCommitBad();
    beep(false);
    updateHUD();
  }
}

function build() {
  const box = $("#wordBox"), meta = $("#metaBox");
  box.innerHTML = ""; meta.innerHTML = ""; S.cells = [];
  if (S.lang === "zh") {
    const word = S.item[0], py = S.item[1] || "";
    const chars = Array.from(word);
    const syls = py.trim().split(/\s+/).filter(Boolean);
    let ti = 0;
    const ok = syls.length === chars.length;
    syls.forEach((syl, si) => {
      const wrap = document.createElement("span"); wrap.className = "syl";
      const hz = document.createElement("span"); hz.className = "hz";
      hz.textContent = ok ? chars[si] : "";
      const pyEl = document.createElement("span"); pyEl.className = "py";
      for (const ch of syl) {
        const b = document.createElement("span"); b.className = "lt"; b.textContent = ch;
        b.dataset.ti = ti; pyEl.appendChild(b);
        S.cells.push({ el: b, ti: ti++, syl: si });
      }
      wrap.append(hz, pyEl); box.appendChild(wrap);
      if (si < syls.length - 1) ti++;
    });
    S.target = syls.map(toAscii).join(" ");
    if (!ok) {
      const realChars = document.createElement("div"); realChars.className = "meta";
      realChars.innerHTML = `<span class="mean">${esc(word)}</span>`;
      meta.appendChild(realChars);
    } else {
      meta.innerHTML = '<span class="hintline">只打字母 · 空格自动跳过</span>';
    }
  } else {
    const word = String(S.item[0]).toLowerCase();
    S.target = word;
    const wrap = document.createElement("span");
    wrap.style.display = "flex"; wrap.style.gap = "2px";
    wrap.style.flexWrap = "wrap"; wrap.style.justifyContent = "center";
    Array.from(word).forEach((ch, i) => {
      const b = document.createElement("span"); b.className = "lt en"; b.textContent = ch;
      b.dataset.ti = i; wrap.appendChild(b);
      S.cells.push({ el: b, ti: i, syl: 0 });
    });
    box.appendChild(wrap);
    meta.innerHTML = `<span class="ipa">${esc(S.item[1] || "")}</span><span class="mean">${esc(S.item[2] || "")}</span>`;
  }
  box.classList.toggle("hidepy", !DB.s.pinyin);
  paint();
}
function curCell() {
  return S.cells.find(c => c.ti === S.idx) || S.cells.find(c => c.ti > S.idx) || null;
}
function paint() {
  const idx = S.idx;
  const cc = curCell();
  for (const c of S.cells) {
    c.el.classList.toggle("done", c.ti < idx);
    c.el.classList.toggle("cur", c === cc);
  }
  if (S.lang === "zh") {
    const syls = $$(".syl", $("#wordBox"));
    syls.forEach((el, si) => {
      const own = S.cells.filter(c => c.syl === si);
      const last = own.length ? own[own.length - 1].ti : -1;
      el.classList.toggle("on", idx > last);
    });
  }
}
function updateHUD() {
  const mins = S.elapsed / 60000;
  const total = S.correct + S.errors;
  $("#hSpeed").textContent = mins > 0.02 ? Math.round(S.correct / mins) : 0;
  $("#hAcc").textContent = total ? Math.round(S.correct / total * 100) : 100;
  $("#hCombo").textContent = S.combo;
  $("#hTime").textContent = fmtTime(S.elapsed);
}
function flashBad() {
  const c = curCell();
  if (!c) return;
  c.el.classList.add("bad");

/* ---------- 输入 ---------- */
document.addEventListener("keydown", e => {
  if (S.screen !== "play") return;
  if (e.key === "Escape") { e.preventDefault(); backHome(); return; }
  if (S.engine === "commit") return;
  if (e.key === "Enter") { e.preventDefault(); replay(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (S.done) { if (/^[a-zA-Z ]$/.test(e.key)) e.preventDefault(); return; }
  if (e.key.length !== 1 || !/[a-zA-Z ]/.test(e.key)) return;
  e.preventDefault();
  const ch = e.key.toLowerCase();
  if (!S.started) { S.started = true; S.t0 = performance.now(); }
  const r = step(S.target, S.idx, ch);
  if (r.ok) {
    if (ch !== " ") S.correct++;
    S.idx = r.idx;
    paint();
    $("#bar").style.width = Math.min(100, S.idx / S.target.length * 100) + "%";
    updateHUD();
    if (S.idx >= S.target.length) completeWord();
  } else {
    S.errors++; S.curErrs++; S.combo = 0;
    if (!S.wrongSet.includes(S.item[0])) S.wrongSet.push(S.item[0]);
    flashBad(); beep(false); updateHUD();
  }
});
$("#imeBox").addEventListener("input", e => { if (!e.isComposing) commitInput(); });
$("#imeBox").addEventListener("paste", e => e.preventDefault());
$("#stage").addEventListener("click", () => {

});
function completeWord() {
  if (S.readPinyin) return completeReadChar();
  if (S.done) return;  S.done = true;
  const clean = S.curErrs === 0;
  S.combo = clean ? S.combo + 1 : 0;
  S.maxCombo = Math.max(S.maxCombo, S.combo);
  const p = DB.p[S.tier.id] || (DB.p[S.tier.id] = { words: {}, cursor: 0, best: 0, runs: 0 });
  p.words[S.item[0]] = clean ? Math.min(9, (p.words[S.item[0]] || 0) + 1) : 0;
  p.cursor = (p.cursor || 0) + 1;
  saveDB();
  beep(true);
  paint();
  const wb = $("#wordBox");
  wb.classList.remove("won"); void wb.offsetWidth; wb.classList.add("won");
  // 打完只响提示音；语音已经在出题时读过，下一题出现时再读下一题

function finish() {
  S.done = true;
  clearTimeout(S.doneTimer);
  const mins = S.elapsed / 60000;
  const cpm = mins > 0.02 ? Math.round(S.correct / mins) : 0;
  const total = S.correct + S.errors;
  const acc = total ? Math.round(S.correct / total * 100) : 100;
  const p = DB.p[S.tier.id] || (DB.p[S.tier.id] = { words: {}, cursor: 0, best: 0, runs: 0 });
  p.runs = (p.runs || 0) + 1;
  if (cpm > (p.best || 0)) p.best = cpm;
  saveDB();
  $("#mTitle").textContent = "「" + S.tier.name + "」本组完成";
  $("#rSpeed").textContent = cpm;
  $("#rAcc").textContent = acc;
  $("#rCombo").textContent = S.maxCombo;
  $("#rTime").textContent = fmtTime(S.elapsed);
  $("#rWrong").innerHTML = S.commitMode === "article"
    ? `共 ${S.commit.text.length} 字，错 ${S.errors} 处。`

      ? "需要再看看： " + S.wrongSet.map(w => `<i>${esc(w)}</i>`).join("、")

        toast("音乐较大，只在本次有效");

      DB.s.musicOn = true; $("#bgmOn").checked = true;
      saveDB(); bgm = null; bgmStart();
    };
    rd.readAsDataURL(f);
  }
  e.target.value = "";
});

/* ---------- 导入我的词库 ---------- */
function normalizeArticle(text, lang) {
  let t = String(text || "").replace(/\r\n?/g, "\n").replace(/\u00a0/g, " ");
  if (lang === "en") {
    t = t.replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[—–]/g, "-").replace(/…/g, "...");
  }
  t = t.split("\n").map(s => s.trim()).filter(Boolean).join(lang === "zh" ? "" : " ");
  if (lang === "en") t = t.replace(/\s+/g, " ").trim();
  return t;
}
function splitSentences(text) {
  const out = []; let start = 0;
  const ends = "。！？!?；;\n";
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    let cut = ends.includes(ch);
    if (!cut && ch === ".") {
      const next = text[i + 1] || " ";
      cut = /\s/.test(next) && !/\d/.test(text[i - 1] || "");
    }
    if (cut) {
      let j = i + 1;
      while (j < text.length && "”’\"'".includes(text[j])) j++;
      out.push({ s: start, e: j });
      start = j; i = j - 1;
    }
  }
  if (start < text.length) out.push({ s: start, e: text.length });
  const chunks = [];
  for (const seg of out) {
    if (seg.e - seg.s <= 60) { chunks.push(seg); continue; }
    for (let k = seg.s; k < seg.e; k += 50) chunks.push({ s: k, e: Math.min(seg.e, k + 50) });
  }
  return chunks;
}
function parseImport(raw, kindChoice, langChoice) {
  const text0 = String(raw || "").replace(/\r\n?/g, "\n").trim();
  if (!text0) throw new Error("内容还是空的");
  const lang = langChoice === "auto" ? (/[\u4e00-\u9fff]/.test(text0) ? "zh" : "en") : langChoice;
  const lines = text0.split("\n").map(s => s.trim()).filter(Boolean);
  let kind = kindChoice;
  if (kind === "auto") {
    if (lines.length && lines.every(l => Array.from(l).length === 1 && /[\u4e00-\u9fff]/.test(l))) kind = "chars";
  }
  if (kind === "auto") {
    const marks = (text0.match(/[。！？!?；;.]/g) || []).length;
    const longLine = lines.some(l => l.length > 20);
    const prose = text0.length > 80 || (lines.length === 1 && /\s/.test(text0));
    kind = (marks >= 1 || longLine || prose || lines.length > 60) ? "article" : "word";
  }
  if (kind === "chars") {
    const out = new Map();
    for (const line of lines) {
      const mm = line.match(/^(.+?)\s*[|｜]\s*(.+)$/);
      if (mm && /[\u4e00-\u9fff]/.test(mm[1])) {
        const ch = Array.from(mm[1].trim())[0];
        const py = mm[2].trim();
        if (ch && py) out.set(ch, ch + "|" + py);
      } else {
        for (const ch of line) if (/[\u4e00-\u9fff]/.test(ch) && !out.has(ch)) out.set(ch, ch);
      }
    }
    const chars = Array.from(out.values());
    if (!chars.length) throw new Error("没有识别到汉字");
    if (chars.length > 3000) throw new Error("字太多，先控制在 3000 个以内");
    return { kind: "chars", lang: "zh", chars };
  }
  if (kind === "article") {
    const text = normalizeArticle(text0, lang);
    if (!text) throw new Error("没有解析到文字");
    if (text.length > 20000) throw new Error("文章太长，先控制在 2 万字以内");
    return { kind, lang, input: "ime", text };
  }
  const words = []; let withPy = 0, skipped = 0;
  for (const line of lines) {
    if (lang === "zh") {
      const m = line.match(/^(.+?)\s*[|｜\t]\s*([a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüńňǹḿ\s']+)$/);
      if (m && /[\u4e00-\u9fff]/.test(m[1])) {
        words.push([m[1].trim(), m[2].trim().replace(/\s+/g, " ")]);
        withPy++;
      } else {
        words.push([line]);
      }
    } else {
      const parts = line.split(/[|｜\t]/).map(s => s.trim());
      const w = (parts[0] || "").toLowerCase();
      if (!/^[a-z]+$/.test(w)) { skipped++; continue; }
      words.push([w, parts[1] || "", parts[2] || ""]);
    }
  }
  if (!words.length) throw new Error("没有解析到有效词条");
  if (words.length > 2000) throw new Error("词条太多，先控制在 2000 条以内");
  const input = (lang === "zh" && withPy === words.length) ? "letter" : "ime";
  if (input === "letter") {
    for (const w of words) {
      if (!w[1]) throw new Error("缺拼音：" + w[0]);
      if (w[1].split(/\s+/).length !== Array.from(w[0]).length) throw new Error("拼音音节和字数对不上：" + w[0]);
      if (/[^a-z]/.test(toAscii(w[1]).replace(/ /g, ""))) throw new Error("拼音里有不认识的字符：" + w[0]);
    }
  } else if (lang === "zh") {
    for (const w of words) w.length = 1;
  }
  return { kind, lang, input, words, skipped };
}
function describeImport(r) {
  if (r.kind === "chars") return `识别：自定义字 ${r.chars.length} 个（会加入随机字池）`;
  if (r.kind === "article") {
    return `识别：${r.lang === "zh" ? "中文" : "英文"}文章 · ${r.text.length} 字 · ${splitSentences(r.text).length} 句 · 输入法模式`;
  }
  return `识别：${r.lang === "zh" ? "中文" : "英文"}词组 · ${r.words.length} 条 · ${r.input === "letter" ? "逐字母输入" : "输入法输入"}` +
    (r.skipped ? ` · 跳过 ${r.skipped} 条不支持的` : "");
}
function updateImpPreview() {
  const el = $("#impHint"), raw = $("#impText").value;
  if (!raw.trim()) { el.textContent = ""; return; }
  try {
    const r = parseImport(raw, $("#impKind").value, $("#impLang").value);
    el.textContent = describeImport(r);
    el.style.color = "#7ee787";
  } catch (e) {
    el.textContent = "✗ " + e.message;
    el.style.color = "#f85149";
  }
}
function openImport(kind) {
  $("#importModal").classList.remove("hidden");
  $("#impName").value = "我的词库 " + ((DB.custom || []).length + 1);
  $("#impText").value = "";
  $("#impKind").value = kind || "auto";
  $("#impLang").value = "auto";
  updateImpPreview();
  setTimeout(() => { try { $("#impText").focus(); } catch (e) {} }, 30);
}
function saveImport() {
  try {
    const r = parseImport($("#impText").value, $("#impKind").value, $("#impLang").value);
    if (r.kind === "chars") {
      const m = new Map();
      for (const raw of [...(DB.chars || []), ...r.chars]) {
        const c = String(raw).split(/[|｜]/)[0];
        if (c) m.set(c, raw);
      }
      DB.chars = Array.from(m.values()).slice(0, 5000);
      saveDB();
      $("#importModal").classList.add("hidden");
      renderHome();
      toast("已加入字池 " + r.chars.length + " 个字");
      return;
    }
    const name = ($("#impName").value || "").trim() || ("我的词库 " + ((DB.custom || []).length + 1));
    const rec = { id: "c" + Date.now().toString(36), name, lang: r.lang, kind: r.kind, input: r.input };
    if (r.kind === "word") rec.words = r.words; else rec.text = r.text;
    if (!validCustom(rec)) throw new Error("导入内容不完整，请重试");
    const trial = { ...DB, custom: [...(DB.custom || []), rec] };
    if (JSON.stringify(trial).length > 2000000) { toast("本地存储快满了，先删掉一些旧词库再导入。"); return; }
    DB.custom = trial.custom;
    saveDB();
    $("#importModal").classList.add("hidden");
    renderHome();
    toast("已导入：" + name);
  } catch (e) {
    toast(e.message);
  }
}
function delCustom(id) {
  const rec = (DB.custom || []).find(c => c.id === id);
  if (!rec) return;
  if (!confirm("删除「" + rec.name + "」以及它的练习记录？")) return;
  DB.custom = (DB.custom || []).filter(c => c.id !== id);
  delete DB.p[id];
  saveDB();
  renderHome();
  toast("已删除");
}
$("#impText").addEventListener("input", updateImpPreview);
$("#impKind").addEventListener("change", updateImpPreview);
$("#impLang").addEventListener("change", updateImpPreview);

  const f = e.target.files && e.target.files[0];

});

/* ---------- 自检（?selftest=1） ---------- */
if (new URLSearchParams(location.search).has("selftest")) {
  const t = [];
  const eq = (name, got, want) => t.push({ name, ok: JSON.stringify(got) === JSON.stringify(want), got, want });
  eq("ascii-tone", toAscii("shí shì"), "shi shi");
  eq("ascii-ü", toAscii("lǜ"), "lv");
  eq("step-basic", step("hu jia", 0, "h"), { idx: 1, ok: true });
  eq("step-skip-space", step("hu jia", 2, "j"), { idx: 4, ok: true });
  eq("step-wrong", step("hu jia", 2, "x").ok, false);
  let i = 0, bad = 0;
  for (const ch of "hujiahuwei") { const r = step("hu jia hu wei", i, ch); if (!r.ok) bad++; i = r.idx; }
  eq("step-full", [i, bad], [13, 0]);
  const imp1 = parseImport("狐假虎威|hú jiǎ hǔ wèi\n画蛇添足|huà shé tiān zú", "auto", "auto");
  eq("imp-zh-pinyin", [imp1.kind, imp1.lang, imp1.input, imp1.words.length], ["word", "zh", "letter", 2]);
  const imp2 = parseImport("实事求是\n脚踏实地", "auto", "auto");
  eq("imp-zh-ime", [imp2.kind, imp2.input, imp2.words.length], ["word", "ime", 2]);
  const imp3 = parseImport("apple|ˈæpl|苹果\nbanana", "auto", "auto");
  eq("imp-en", [imp3.kind, imp3.lang, imp3.input, imp3.words.length], ["word", "en", "letter", 2]);
  const imp4 = parseImport("春天来了。柳树发芽了。燕子从南方飞回来了。", "auto", "auto");
  eq("imp-article", [imp4.kind, imp4.lang, imp4.text.length], ["article", "zh", 22]);
  eq("sents", splitSentences("我爱你。你好！").length, 2);
  const problems = [];
  for (const mode of ["zh", "en"]) {
    for (const tier of tiersOf(mode)) {
      const seen = new Set();
      tier.words.forEach(w => {
        if (seen.has(w[0])) problems.push(tier.id + " dup:" + w[0]);
        seen.add(w[0]);
        if (mode === "zh") {
          if (!w[1]) problems.push(tier.id + " nopy:" + w[0]);
          else if (Array.from(w[1].trim().split(/\s+/)).length !== Array.from(w[0]).length) problems.push(tier.id + " syl:" + w[0]);
          if (/[^a-z]/.test(toAscii(w[1]).replace(/ /g, ""))) problems.push(tier.id + " ascii:" + w[0]);
        } else {
          if (!/^[a-z]+$/.test(w[0])) problems.push(tier.id + " word:" + w[0]);
          if (!w[1]) problems.push(tier.id + " noipa:" + w[0]);
        }
      });
      t.push({ name: "tier:" + tier.id, ok: true, count: tier.words.length });
    }
  }
  t.push({ name: "data", ok: problems.length === 0, problems: problems.slice(0, 40) });
  const allOk = t.every(x => x.ok);
  document.title = allOk ? "SELFTEST-OK" : "SELFTEST-FAIL";
  $("#selftest").textContent = JSON.stringify(t, null, 1);
}
